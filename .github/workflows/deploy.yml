name: Validate and deploy ArchInvoice web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app and Cloudflare API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run guard
      - run: npm run build:web
        env:
          EXPO_PUBLIC_AUTH_PROVIDER: cloudflare
          EXPO_PUBLIC_API_BASE_URL: https://api.archinvoice.infraaceops.com
          EXPO_PUBLIC_APP_DOMAIN: archinvoice.infraaceops.com
      - run: npm ci --prefix worker
      - run: npm run typecheck --prefix worker
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: npm run build --prefix functions

  deploy-pages:
    name: Deploy GitHub Pages site
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          EXPO_PUBLIC_AUTH_PROVIDER: cloudflare
          EXPO_PUBLIC_API_BASE_URL: https://api.archinvoice.infraaceops.com
          EXPO_PUBLIC_APP_DOMAIN: archinvoice.infraaceops.com
      - name: Set custom domain
        run: echo "archinvoice.infraaceops.com" > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
